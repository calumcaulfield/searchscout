name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The demo adapter needs no store and no token, which is what lets the whole
  # suite — including the web UI tests — run in CI.
  SCOUT_ADAPTER: demo
  SCOUT_DEMO_PRODUCT_COUNT: "30"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest tests --cov=searchscout --cov-report=term-missing

      # The safety claims in the README are verified rather than asserted: the
      # walkthrough fails loudly if markup was altered or rollback was not exact.
      - name: Demo — markup preserved and rollback exact
        run: |
          OUTPUT=$(PYTHONPATH=src python -m searchscout.demo_walkthrough)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "0 products with altered tag structure ✓" \
            || { echo "::error::an edit altered tag structure"; exit 1; }
          echo "$OUTPUT" | grep -q "every product restored byte-for-byte ✓" \
            || { echo "::error::rollback was not exact"; exit 1; }
