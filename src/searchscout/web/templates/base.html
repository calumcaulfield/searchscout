<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SearchScout</title>
  <style>
    :root {
      --bg:#0c0d0f; --panel:#141619; --line:#23262b;
      --text:#e8eaed; --dim:#9aa0a6; --faint:#6b7176;
      --accent:#7cb3f5; --ok:#6ee7a8; --warn:#e8c07d; --danger:#f08a8a;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
         font:14px/1.55 ui-sans-serif,-apple-system,system-ui,sans-serif}
    header{border-bottom:1px solid var(--line);padding:14px 28px;display:flex;
           align-items:center;gap:14px}
    header b{font-weight:600;letter-spacing:-.01em}
    .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
          text-transform:uppercase;color:var(--dim);border:1px solid var(--line);
          padding:3px 9px;border-radius:6px}
    main{max-width:1120px;margin:0 auto;padding:28px}
    h1{font-size:22px;font-weight:580;letter-spacing:-.02em;margin:0 0 6px}
    p.lede{color:var(--dim);margin:0 0 22px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
           padding:18px;margin-bottom:16px}
    label{display:block;font-size:12px;color:var(--faint);margin-bottom:5px}
    input,select{background:#101216;border:1px solid var(--line);border-radius:7px;
                 color:var(--text);padding:8px 10px;font-size:13px;width:100%}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .row>div{flex:1;min-width:170px}
    button{background:#1d2025;border:1px solid #2e3238;border-radius:7px;
           color:var(--text);padding:8px 15px;font-size:13px;cursor:pointer}
    button:hover{background:#24282e}
    button.primary{background:#20402f;border-color:#2f6046;color:var(--ok)}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
       text-transform:uppercase;color:var(--faint);font-weight:500;
       border-bottom:1px solid var(--line);padding:8px 10px}
    td{padding:9px 10px;border-bottom:1px solid #1b1e22;vertical-align:top}
    .mono{font-family:var(--mono);font-size:12px}
    .dim{color:var(--dim)} .faint{color:var(--faint)}
    .del{color:var(--danger);text-decoration:line-through}
    .ins{color:var(--ok)}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
          font-size:11px;white-space:nowrap;border:1px solid transparent}
    .pill::before{content:"";width:5px;height:5px;border-radius:999px;background:currentColor}
    .pill.ok{color:var(--ok);background:rgba(110,231,168,.1);border-color:rgba(110,231,168,.18)}
    .pill.warn{color:var(--warn);background:rgba(232,192,125,.1);border-color:rgba(232,192,125,.2)}
    .pill.bad{color:var(--danger);background:rgba(240,138,138,.1);border-color:rgba(240,138,138,.2)}
    .pill.idle{color:var(--dim);background:rgba(255,255,255,.04);border-color:var(--line)}
    .cards{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
    @media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 16px}
    .card .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
             color:var(--faint)}
    .card .v{font-size:26px;font-weight:540;letter-spacing:-.03em;margin-top:6px;
             font-variant-numeric:tabular-nums}
    .card .n{font-size:11.5px;color:var(--dim);margin-top:2px}
    .card a{color:inherit;display:block}
    .card.link:hover{border-color:var(--accent)}
    .split{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);
           align-items:start}
    @media(max-width:1000px){.split{grid-template-columns:1fr}}
    .muted{color:var(--dim)}
    .warnrow{display:flex;justify-content:space-between;padding:8px 0;
             border-bottom:1px solid #1b1e22;font-size:13px}
    .warnrow:last-child{border-bottom:none}
    h2{font-size:15px;font-weight:560;margin:0 0 10px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
    .toolbar label{margin:0}
    .toolbar .grow{flex:1;min-width:200px}
    code.inline{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.05);
                padding:1px 5px;border-radius:4px}
    .notice{border:1px solid var(--line);border-radius:8px;padding:11px 14px;
            margin-bottom:16px;color:var(--dim);font-size:13px}
    .notice.warn{border-color:#4a4028;background:#221d13;color:#e6d3ae}
    a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <header>
    <b>SearchScout</b>
    <span class="chip">catalogue operations</span>
    <nav style="display:flex;gap:2px;margin-left:10px">
      <a href="/" style="padding:5px 10px;border-radius:6px;font-size:13px">Dashboard</a>
      <a href="/search" style="padding:5px 10px;border-radius:6px;font-size:13px">Search</a>
      <a href="/index" style="padding:5px 10px;border-radius:6px;font-size:13px">Bulk update</a>
      <a href="/activity" style="padding:5px 10px;border-radius:6px;font-size:13px">Activity</a>
    </nav>
    <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <span class="chip">{{ adapter }}</span>
      {% if is_demo %}<a href="/reset-demo" class="chip">Reset demo</a>{% endif %}
    </span>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
